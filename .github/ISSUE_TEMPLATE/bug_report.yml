name: Bug report
description: Something in the ATMAN scaffold isn't working right
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The faster we can reproduce it, the faster it gets fixed.
        Please don't include private data — no private core files, no operator details, no secrets.
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Which commit or release are you running? (`git rev-parse --short HEAD`)
      placeholder: e.g. a1b96c1
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: e.g. 3.11.4
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. Ubuntu 22.04 / Windows 11 / macOS 14
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps, starting from a fresh clone if possible.
      placeholder: |
        1. git clone ...
        2. python onboard.py ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste the relevant terminal output or traceback.
      render: text
